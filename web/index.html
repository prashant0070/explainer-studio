<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explainer Studio</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Explainer Studio</p>
      <h1>Research → script → voiceover → finished video</h1>
    </div>
    <div class="status" id="status">Checking keys…</div>
  </header>

  <main>
    <section class="panel form-panel">
      <h2>Niche intel</h2>
      <label>Niche / channel description
        <textarea id="niche" rows="3" placeholder="Cinematic story explainers — entire myths and disasters, hook-first, cut every few seconds">Science and tech told as cinematic story explainers — the ENTIRE story of one discovery, disaster, or machine. Same art form as Icarus: one causal hook, painted 16:9 stills, cut every 8–18 seconds. Not a lecture. Not Kurzgesagt blobs.</textarea>
      </label>
      <div class="row">
        <button type="button" id="lane-myth" class="ghost lane-btn">Mythic epics</button>
        <button type="button" id="lane-science" class="ghost lane-btn active">Science &amp; tech</button>
      </div>
      <div class="actions">
        <button id="intel-btn" class="primary">Analyze the niche</button>
        <button id="ideas-btn" class="ghost">Quick ideas only</button>
      </div>
      <ul id="ideas" class="recent"></ul>

      <h2>New production</h2>
      <label>Topic
        <input id="topic" placeholder="The entire story of the Odyssey" />
      </label>
      <div class="row">
        <label>Style
          <select id="style">
            <option value="odyssey">Odyssey explainer</option>
            <option value="dark_vault">Dark Vault investigation</option>
            <option value="science">Science &amp; tech story</option>
          </select>
        </label>
          <label>Length
          <select id="duration">
            <option value="8">8 min</option>
            <option value="12" selected>12 min</option>
            <option value="15">15 min</option>
            <option value="25">25 min</option>
          </select>
        </label>
      </div>
      <label>Angle / hook idea
        <textarea id="angle" rows="2" placeholder="The 10-year voyage happened because he shouted his name at the Cyclops."></textarea>
      </label>
      <label>Source notes (optional)
        <textarea id="notes" rows="3" placeholder="Facts you want the script to keep. Auto-research adds Wikipedia-grounded facts."></textarea>
      </label>
      <label class="check-label"><input type="checkbox" id="auto-research" checked /> Auto-research the topic (free, Wikipedia-grounded)</label>
      <div class="actions">
        <button id="generate" class="primary">Generate script</button>
        <button id="demo" class="ghost">Load Icarus demo</button>
      </div>
      <p class="hint" id="form-error"></p>
      <h3>Production queue</h3>
      <p class="meta" id="queue-meta"></p>
      <ul id="queue" class="recent queue-list"></ul>
      <h3>Recent</h3>
      <ul id="recent" class="recent"></ul>
    </section>

    <section class="panel script-panel" id="workspace">
      <div class="empty" id="empty">
        Hit <strong>Science &amp; tech</strong> or open the production queue.
        All ten science topics (and the mythic ten) are saved — pick one and generate.
      </div>
      <div id="intel" hidden></div>
      <div id="pack" hidden>
        <div class="pack-head">
          <div>
            <p class="eyebrow" id="pack-style"></p>
            <h2 id="pack-title"></h2>
            <p class="meta" id="pack-meta"></p>
          </div>
          <div class="actions">
            <button id="render-btn" class="primary">Produce full video</button>
            <button id="virality-btn" class="ghost">Will it go viral?</button>
            <button id="make-images" class="ghost">Generate 8 images</button>
            <button id="export" class="ghost">Export zip</button>
          </div>
        </div>

        <div class="render-controls">
          <label>Voice
            <select id="voice"></select>
          </label>
          <label>Pace
            <select id="pace">
              <option value="normal" selected>Normal</option>
              <option value="faster">Faster (+15%) — more engaging</option>
              <option value="fastest">Fastest (+28%)</option>
            </select>
          </label>
          <label>Image engine
            <select id="image-engine">
              <option value="auto" selected>Auto (paid if key set, else free)</option>
              <option value="paid">Paid — DALL·E, same as image packs</option>
              <option value="free">Free — Pollinations</option>
            </select>
          </label>
          <label class="check-label"><input type="checkbox" id="opt-captions" checked /> Captions</label>
          <label class="check-label"><input type="checkbox" id="opt-music" checked /> Music (if a track exists in data/music)</label>
        </div>

        <div id="render-progress" class="render-progress" hidden>
          <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
          <p class="meta" id="render-message"></p>
        </div>

        <div id="virality-wrap" class="virality" hidden></div>

        <div id="video-wrap" hidden>
          <video id="player" controls preload="metadata"></video>
          <div id="qc-report" class="qc"></div>
        </div>

        <p class="hook" id="pack-hook"></p>
        <p class="thesis" id="pack-thesis"></p>
        <div class="tabs">
          <button data-tab="scenes" class="active">Scenes</button>
          <button data-tab="narration">Full narration</button>
          <button data-tab="research">Research</button>
          <button data-tab="youtube">YouTube</button>
        </div>
        <div id="tab-scenes" class="tab-body">
          <div id="scenes" class="scenes"></div>
        </div>
        <div id="tab-narration" class="tab-body" hidden>
          <pre id="narration"></pre>
        </div>
        <div id="tab-research" class="tab-body" hidden>
          <pre id="research"></pre>
        </div>
        <div id="tab-youtube" class="tab-body" hidden>
          <pre id="youtube"></pre>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
